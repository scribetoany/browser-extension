<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Promo tile</title>
    <!-- 440×280 Chrome Web Store small promo tile -->
    <style>
      html,
      body {
        margin: 0;
        width: 440px;
        height: 280px;
        overflow: hidden;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: #f2efe9;
        background:
          radial-gradient(circle at 20% 15%, rgba(201, 100, 66, 0.35), transparent 55%),
          #1c1b19;
      }
      .wrap {
        padding: 34px 36px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 22px;
      }
      h1 {
        font-size: 32px;
        line-height: 1.12;
        margin: 0 0 14px;
        letter-spacing: -0.02em;
      }
      .accent {
        color: #e0805f;
      }
      p {
        margin: 0;
        font-size: 15px;
        color: #c9c3b9;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">
        <img src="/src/icons/icon-48.png" width="30" height="30" alt="" />
        ScribeToAny
      </div>
      <h1>Video to text<br /><span class="accent">in one click</span></h1>
      <p>Transcripts and SRT/VTT subtitles, about 98 languages</p>
    </div>
  </body>
</html>
